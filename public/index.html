<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OG Check</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }
    h1 { font-size: 2rem; margin-bottom: 0.5rem; color: #f8fafc; }
    .subtitle { color: #94a3b8; margin-bottom: 2rem; }
    .search-box {
      display: flex;
      gap: 0.5rem;
      width: 100%;
      max-width: 640px;
      margin-bottom: 2rem;
    }
    input[type="text"] {
      flex: 1;
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      border: 1px solid #334155;
      background: #1e293b;
      color: #f8fafc;
      font-size: 1rem;
      outline: none;
    }
    input[type="text"]:focus { border-color: #6366f1; }
    button {
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      border: none;
      background: #6366f1;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover { background: #4f46e5; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .error {
      background: #7f1d1d;
      border: 1px solid #991b1b;
      padding: 1rem;
      border-radius: 0.5rem;
      max-width: 640px;
      width: 100%;
    }
    .results {
      width: 100%;
      max-width: 640px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 0.75rem;
      overflow: hidden;
      margin-bottom: 1.5rem;
    }
    .card-header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid #334155;
      font-weight: 600;
      color: #94a3b8;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .card-body { padding: 1rem 1.25rem; }
    .tag-row {
      display: flex;
      gap: 1rem;
      padding: 0.6rem 0;
      border-bottom: 1px solid #1e293b;
    }
    .tag-row:last-child { border-bottom: none; }
    .tag-name {
      min-width: 140px;
      color: #6366f1;
      font-weight: 500;
      font-family: monospace;
      font-size: 0.9rem;
    }
    .tag-value { color: #e2e8f0; word-break: break-all; }
    .preview-card {
      background: #fff;
      border-radius: 0.5rem;
      overflow: hidden;
      color: #1e293b;
      max-width: 500px;
    }
    .preview-card img {
      width: 100%;
      max-height: 260px;
      object-fit: cover;
      display: block;
    }
    .preview-card .preview-text { padding: 0.75rem 1rem; }
    .preview-card .preview-site { font-size: 0.75rem; color: #64748b; text-transform: uppercase; }
    .preview-card .preview-title { font-weight: 700; font-size: 1rem; margin: 0.25rem 0; color: #0f172a; }
    .preview-card .preview-desc { font-size: 0.85rem; color: #475569; }
    .meta-info { font-size: 0.85rem; color: #94a3b8; }
    .meta-info span { color: #e2e8f0; }
    .spinner {
      width: 20px; height: 20px;
      border: 2px solid #6366f1;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      display: inline-block;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <h1>OG Check</h1>
  <p class="subtitle">Inspect OpenGraph tags for any URL</p>

  <div class="search-box">
    <input type="text" id="url-input" placeholder="Enter a URL..." autofocus>
    <button id="check-btn" onclick="checkUrl()">Check</button>
  </div>

  <div id="output"></div>

  <script>
    const input = document.getElementById("url-input");
    const btn = document.getElementById("check-btn");
    const output = document.getElementById("output");

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") checkUrl();
    });

    async function checkUrl() {
      const url = input.value.trim();
      if (!url) return;

      btn.disabled = true;
      output.innerHTML = '<div class="spinner"></div>';

      try {
        const res = await fetch("/api/check", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url }),
        });

        const data = await res.json();

        if (!res.ok) {
          output.innerHTML = `<div class="error">${escHtml(data.error)}</div>`;
          return;
        }

        render(data);
      } catch (err) {
        output.innerHTML = `<div class="error">Network error: ${escHtml(err.message)}</div>`;
      } finally {
        btn.disabled = false;
      }
    }

    function render(data) {
      const { tags, url, finalUrl, statusCode } = data;
      const ogTags = {};
      const twitterTags = {};
      const otherTags = {};

      for (const [k, v] of Object.entries(tags)) {
        if (k.startsWith("og:")) ogTags[k] = v;
        else if (k.startsWith("twitter:")) twitterTags[k] = v;
        else otherTags[k] = v;
      }

      let html = "";

      // Meta info
      html += `<div class="card"><div class="card-header">Request Info</div><div class="card-body meta-info">`;
      html += `<p>URL: <span>${escHtml(url)}</span></p>`;
      if (finalUrl !== url) html += `<p>Redirected to: <span>${escHtml(finalUrl)}</span></p>`;
      html += `<p>Status: <span>${statusCode}</span></p>`;
      html += `</div></div>`;

      // Preview
      const ogImage = tags["og:image"] || tags["twitter:image"];
      const ogTitle = tags["og:title"] || tags["twitter:title"] || tags["_title"] || "";
      const ogDesc = tags["og:description"] || tags["twitter:description"] || tags["description"] || "";
      const siteName = tags["og:site_name"] || new URL(finalUrl).hostname;

      if (ogTitle) {
        html += `<div class="card"><div class="card-header">Social Preview</div><div class="card-body">`;
        html += `<div class="preview-card">`;
        if (ogImage) html += `<img src="${escAttr(ogImage)}" alt="OG Image" onerror="this.style.display='none'">`;
        html += `<div class="preview-text">`;
        html += `<div class="preview-site">${escHtml(siteName)}</div>`;
        html += `<div class="preview-title">${escHtml(ogTitle)}</div>`;
        if (ogDesc) html += `<div class="preview-desc">${escHtml(ogDesc)}</div>`;
        html += `</div></div>`;
        html += `</div></div>`;
      }

      // OG tags
      if (Object.keys(ogTags).length) {
        html += tagTable("OpenGraph Tags", ogTags);
      }

      // Twitter tags
      if (Object.keys(twitterTags).length) {
        html += tagTable("Twitter Card Tags", twitterTags);
      }

      // Other meta
      if (Object.keys(otherTags).length) {
        html += tagTable("Other Meta Tags", otherTags);
      }

      if (!Object.keys(tags).length) {
        html += `<div class="error">No OpenGraph or Twitter Card tags found.</div>`;
      }

      output.innerHTML = html;
    }

    function tagTable(title, tags) {
      let html = `<div class="card"><div class="card-header">${escHtml(title)}</div><div class="card-body">`;
      for (const [k, v] of Object.entries(tags)) {
        html += `<div class="tag-row"><div class="tag-name">${escHtml(k)}</div><div class="tag-value">${escHtml(v)}</div></div>`;
      }
      html += `</div></div>`;
      return html;
    }

    function escHtml(s) {
      const div = document.createElement("div");
      div.textContent = s;
      return div.innerHTML;
    }

    function escAttr(s) {
      return s.replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
